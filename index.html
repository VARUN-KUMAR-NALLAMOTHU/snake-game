<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="./styles.css?v=6" />
    <link rel="icon" href="favicon.ico">
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="panel__header">
          <div>
            <p class="eyebrow">Classic Arcade</p>
            <h1>Snake</h1>
          </div>
          <button id="restart-button" class="button" type="button">Restart</button>
        </div>

        <div class="stats" aria-label="Game stats">
          <div class="stat">
            <span class="stat__label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span class="stat__label">Best</span>
            <strong id="high-score">0</strong>
          </div>
          <div class="stat">
            <span class="stat__label">Speed</span>
            <strong id="speed">1x</strong>
          </div>
          <div class="stat">
            <span class="stat__label">Status</span>
            <strong id="status">Running</strong>
          </div>
        </div>

        <div class="toolbar" aria-label="Game options">
          <button id="music-button" class="button" type="button" aria-pressed="false">
            Music Off
          </button>
          <div class="themes" aria-label="Theme controls">
            <button class="button" data-theme="classic" type="button">Classic</button>
            <button class="button" data-theme="dark" type="button">Dark</button>
            <button class="button" data-theme="neon" type="button">Neon</button>
          </div>
        </div>

        <div class="board-wrap">
          <div
            id="board"
            class="board"
            role="grid"
            aria-label="Snake game board"
          ></div>
          <div id="overlay" class="overlay" hidden>
            <p id="overlay-text" class="overlay__text"></p>
            <button id="overlay-button" class="button" type="button">Restart</button>
          </div>
        </div>

        <section class="keyboard" aria-label="iPhone keypad controls">
          <div class="controls-copy keyboard__copy">
            <p>Use arrow keys or WASD to move.</p>
            <p>On iPhone, use the keypad below and tap pause anytime.</p>
          </div>

          <div class="keyboard__shell">
            <div class="keyboard__top-row">
              <button
                data-action="pause"
                class="key key--wide key--secondary"
                type="button"
                aria-label="Pause or resume"
              >
                Pause
              </button>
            </div>

            <div class="controls" aria-label="Touch controls">
              <button data-direction="up" class="key control control--up" type="button" aria-label="Move up">
                ↑
              </button>
              <button data-direction="left" class="key control control--left" type="button" aria-label="Move left">
                ←
              </button>
              <button data-direction="down" class="key control control--down" type="button" aria-label="Move down">
                ↓
              </button>
              <button data-direction="right" class="key control control--right" type="button" aria-label="Move right">
                →
              </button>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./src/main.js?v=6"></script>
  </body>
</html>
